name: Release

# We do not publish to npm.  This workflow only turns merged changesets
# into a "Version Packages" PR that bumps versions and updates the
# changelog; merging that PR tags the release in-repo.  No NPM_TOKEN, no
# publish step — so it never fails on a missing registry credential.

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Create or update the Version Packages PR
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
